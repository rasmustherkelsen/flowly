services:
  # sql-server:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   ports:
  #     - "1433:1433"
  #   environment:
  #     - ACCEPT_EULA=Y
  #     - SA_PASSWORD=Strong01
  #   container_name: producthubsql
  
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Pass@word1
    # healthcheck:
    #   test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Pass@word1' -Q 'SELECT 1' -b -o /dev/null -C"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 15
    #   start_period: 20s
    container_name: servicebus-sql

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      SQL_SERVER: sql-server
      MSSQL_SA_PASSWORD: 'Pass@word1'
      ACCEPT_EULA: Y
      SQL_WAIT_INTERVAL: 15
    ports:
      - "5672:5672"
    volumes:
      - ./sbconfig.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      - sql-server
      
    # depends_on:
    #   sql-server:
    #     condition: service_healthy

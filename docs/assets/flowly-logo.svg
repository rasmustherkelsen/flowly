<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Icon: 48x48 rounded square -->
  <rect width="48" height="48" rx="10" ry="10" fill="url(#bg)"/>

  <!-- Three flow chevrons scaled to 48px height -->
  <!-- Each chevron: tip 20px wide, height 28px (±14 from center 24) -->
  <polyline points="7,14 17,24 7,34"
    stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
    fill="none" opacity="0.30"/>
  <polyline points="18,14 28,24 18,34"
    stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
    fill="none" opacity="0.65"/>
  <polyline points="29,14 39,24 29,34"
    stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
    fill="none" opacity="1.0"/>

  <!-- Wordmark: "Flowly" -->
  <text x="62" y="33"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="28" font-weight="600" fill="#1E3A8A" letter-spacing="-0.5">Flowly</text>
</svg>

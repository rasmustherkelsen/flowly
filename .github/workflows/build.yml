name: Build

on:
  push:
    branches: [ "main", "development", "feature/**" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Flowly.sln

      - name: Install Aspire CLI bundle
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=Sdk="Aspire.AppHost.Sdk/)[^"]+' samples/RabbitMQ/Aspire/RabbitMQAspire.AppHost/RabbitMQAspire.AppHost.csproj)
          echo "Aspire CLI version (Aspire.AppHost.Sdk of the sample AppHosts): $VERSION"

          for attempt in 1 2 3 4 5; do
            if timeout 300 dotnet dnx --yes "aspire.cli@$VERSION" -- setup --install-path "${ASPIRE_HOME:-$HOME/.aspire}"; then
              exit 0
            fi
            echo "::warning::Aspire CLI bundle setup attempt $attempt failed"
            sleep $((attempt * 15))
          done

          echo "::error::Aspire CLI bundle setup failed after 5 attempts"
          exit 1

      - name: Build
        run: dotnet build Flowly.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Flowly.sln --no-build --configuration Release --verbosity normal

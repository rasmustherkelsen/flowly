name: Build

on:
  push:
    branches: [ "main", "development", "feature/**" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Flowly.sln

      - name: Build
        run: dotnet build Flowly.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Flowly.sln --no-build --configuration Release --verbosity normal

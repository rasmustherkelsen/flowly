<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Three flow chevrons: fading in from left to right -->
  <polyline points="22,40 44,64 22,88"
    stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
    fill="none" opacity="0.30"/>
  <polyline points="48,40 70,64 48,88"
    stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
    fill="none" opacity="0.65"/>
  <polyline points="74,40 96,64 74,88"
    stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
    fill="none" opacity="1.0"/>
</svg>

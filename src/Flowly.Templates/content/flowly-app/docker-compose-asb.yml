services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: servicebus-sql
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password1!

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      SQL_SERVER: sql-server
      MSSQL_SA_PASSWORD: 'Password1!'
      ACCEPT_EULA: Y
      SQL_WAIT_INTERVAL: 15
    ports:
      - "5672:5672"
    volumes:
      - ./sbconfig.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      - sql-server
#if (NeedsPostgresInfrastructure)
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
#endif
#if (UseOtelExportJaeger)
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
    container_name: jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"
      - "5778:5778"
      - "9411:9411"
#endif
#if (UseOtelExportZipkin)
  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"
#endif

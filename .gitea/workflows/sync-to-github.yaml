name: Sync to GitHub
run-name: Sync Flowly main branch to GitHub

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-test-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI bundle
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=Sdk="Aspire.AppHost.Sdk/)[^"]+' samples/RabbitMQ/Aspire/RabbitMQAspire.AppHost/RabbitMQAspire.AppHost.csproj)
          echo "Aspire CLI version (Aspire.AppHost.Sdk of the sample AppHosts): $VERSION"

          for attempt in 1 2 3 4 5; do
            if timeout 300 dotnet dnx --yes "aspire.cli@$VERSION" -- setup --install-path "${ASPIRE_HOME:-$HOME/.aspire}"; then
              exit 0
            fi
            echo "::warning::Aspire CLI bundle setup attempt $attempt failed"
            sleep $((attempt * 15))
          done

          echo "::error::Aspire CLI bundle setup failed after 5 attempts"
          exit 1

      - name: Build
        run: dotnet build Flowly.sln --configuration Release

      - name: Test
        run: dotnet test Flowly.sln --configuration Release --no-build

      - name: Push to GitHub
        run: |
          git remote add github \
            https://x-access-token:${{ secrets.PAT_FOR_GITHUB }}@github.com/rasmustherkelsen/flowly.git
          git push github HEAD:main --force
          git push github --tags --force

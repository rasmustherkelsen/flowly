name: Publish to NuGet
run-name: Publishing Flowly to Nuget

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update Flowly package versions in templates
        run: |
          find src/Flowly.Templates/content -name "*.csproj" | \
            xargs sed -i "s/\(Include=\"Flowly[^\"]*\"\) Version=\"[^\"]*\"/\1 Version=\"$VERSION\"/g"

      - name: Set PowerShell module version from the tag
        run: |
          MANIFEST=src/Flowly.PowerShell/Flowly.PowerShell.psd1
          NUMERIC="${VERSION%%[-+]*}"
          SUFFIX="${VERSION#"$NUMERIC"}"
          PRERELEASE=$(printf '%s' "${SUFFIX%%+*}" | tr -cd '0-9A-Za-z')
          if ! printf '%s' "$NUMERIC" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Tag version '$VERSION' does not start with a numeric version of two to four parts, which PowerShell requires for ModuleVersion." >&2
            exit 1
          fi
          sed -E -i.bak \
            -e "s/^([[:space:]]*ModuleVersion[[:space:]]*=[[:space:]]*)'[^']*'/\1'$NUMERIC'/" \
            -e "s/^([[:space:]]*Prerelease[[:space:]]*=[[:space:]]*)'[^']*'/\1'$PRERELEASE'/" \
            "$MANIFEST"
          rm "$MANIFEST.bak"
          grep -Eq "^[[:space:]]*ModuleVersion[[:space:]]*=[[:space:]]*'$NUMERIC'" "$MANIFEST" || { echo "ModuleVersion was not set in $MANIFEST." >&2; exit 1; }
          grep -Eq "^[[:space:]]*Prerelease[[:space:]]*=[[:space:]]*'$PRERELEASE'" "$MANIFEST" || { echo "Prerelease was not set in $MANIFEST." >&2; exit 1; }
          grep -E "^[[:space:]]*(ModuleVersion|Prerelease)[[:space:]]*=" "$MANIFEST"

      - name: Install Aspire CLI bundle
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=Sdk="Aspire.AppHost.Sdk/)[^"]+' samples/RabbitMQ/Aspire/RabbitMQAspire.AppHost/RabbitMQAspire.AppHost.csproj)
          echo "Aspire CLI version (Aspire.AppHost.Sdk of the sample AppHosts): $VERSION"

          for attempt in 1 2 3 4 5; do
            if timeout 300 dotnet dnx --yes "aspire.cli@$VERSION" -- setup --install-path "${ASPIRE_HOME:-$HOME/.aspire}"; then
              exit 0
            fi
            echo "::warning::Aspire CLI bundle setup attempt $attempt failed"
            sleep $((attempt * 15))
          done

          echo "::error::Aspire CLI bundle setup failed after 5 attempts"
          exit 1

      - name: Build
        run: dotnet build --configuration Release /p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack --configuration Release --no-build /p:Version=${{ env.VERSION }} --output ./artifacts

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

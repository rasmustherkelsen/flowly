name: Dependency Vulnerability Audit
run-name: Scheduled dependency vulnerability audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and check for known vulnerabilities
        run: |
          set -o pipefail
          dotnet restore Flowly.sln --force 2>&1 | tee restore.log
          if grep -E "NU1901|NU1902|NU1903" restore.log > vulnerabilities.txt; then
            echo "Vulnerable package(s) found:"
            cat vulnerabilities.txt
            exit 1
          fi
          echo "No known vulnerabilities found."

      - name: Email on vulnerability
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.MAIL_SERVER }}
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Flowly: dependency vulnerability detected"
          to: ${{ vars.MAIL_TO }}
          from: 'Flowly CI <${{ secrets.MAIL_USERNAME }}>'
          body_file: vulnerabilities.txt

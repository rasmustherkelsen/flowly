name: CI
run-name: Continuous Integration 🚀 of Flowly on behalf of ${{ gitea.actor }}

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check template OpenTelemetry version sync
        run: |
          set -euo pipefail
          CANONICAL=$(grep -oP '(?<=Include="OpenTelemetry.Extensions.Hosting" Version=")[^"]+' src/Flowly.OpenTelemetry/Flowly.OpenTelemetry.csproj)
          echo "Canonical OpenTelemetry version (src/Flowly.OpenTelemetry/Flowly.OpenTelemetry.csproj): $CANONICAL"

          PACKAGES=(
            "OpenTelemetry.Extensions.Hosting"
            "OpenTelemetry.Exporter.OpenTelemetryProtocol"
            "OpenTelemetry.Exporter.Zipkin"
            "OpenTelemetry.Instrumentation.AspNetCore"
            "OpenTelemetry.Instrumentation.Http"
            "OpenTelemetry.Instrumentation.Runtime"
          )

          FAIL=0
          for pkg in "${PACKAGES[@]}"; do
            MISMATCHES=$(grep -rn "Include=\"$pkg\" Version=\"" src/Flowly.Templates/content --include="*.csproj" | grep -v "Version=\"$CANONICAL\"" || true)
            if [ -n "$MISMATCHES" ]; then
              echo "::error::Template package $pkg does not match canonical version $CANONICAL:"
              echo "$MISMATCHES"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "See .claude/rules/template-otel-versions.md"
            exit 1
          fi
          echo "All template OpenTelemetry package versions match $CANONICAL"

      - name: Check template project paths
        run: |
          set -euo pipefail
          FAIL=0
          while IFS= read -r slnx; do
            while IFS= read -r path; do
              if [ ! -f "$(dirname "$slnx")/$path" ]; then
                echo "::error::$slnx references missing project $path (file names are case-sensitive here)"
                FAIL=1
              fi
            done < <(grep -oP '(?<=<Project Path=")[^"]+' "$slnx")
          done < <(find src/Flowly.Templates/content -name '*.slnx')
          while IFS= read -r csproj; do
            while IFS= read -r ref; do
              if [ ! -f "$(dirname "$csproj")/${ref//\\//}" ]; then
                echo "::error::$csproj references missing project $ref (file names are case-sensitive here)"
                FAIL=1
              fi
            done < <(grep -oP '(?<=<ProjectReference Include=")[^"]+' "$csproj")
          done < <(find src/Flowly.Templates/content -name '*.csproj' -not -path '*/flowly-skills/*')
          exit $FAIL

      - name: Install Aspire CLI bundle
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=Sdk="Aspire.AppHost.Sdk/)[^"]+' samples/RabbitMQ/Aspire/RabbitMQAspire.AppHost/RabbitMQAspire.AppHost.csproj)
          echo "Aspire CLI version (Aspire.AppHost.Sdk of the sample AppHosts): $VERSION"

          for attempt in 1 2 3 4 5; do
            if timeout 300 dotnet dnx --yes "aspire.cli@$VERSION" -- setup --install-path "${ASPIRE_HOME:-$HOME/.aspire}"; then
              exit 0
            fi
            echo "::warning::Aspire CLI bundle setup attempt $attempt failed"
            sleep $((attempt * 15))
          done

          echo "::error::Aspire CLI bundle setup failed after 5 attempts"
          exit 1

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build